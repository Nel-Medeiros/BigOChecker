<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BigO Checker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 40px;
      border-bottom: 1px solid #313244;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 1.4rem; font-weight: 600; }

    .header-right {
      margin-left: auto;
    }

    .github-link {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #a6adc8;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 12px;
      border: 1px solid #313244;
      border-radius: 6px;
      transition: color 0.15s, border-color 0.15s;
    }

    .github-link:hover { color: #cdd6f4; border-color: #585b70; }
    .github-link svg { flex-shrink: 0; }

    .badge-mvp {
      background: #313244;
      color: #a6e3a1;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    main {
      flex: 1;
      padding: 32px 40px;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }

    .field-label {
      display: block;
      font-size: 0.78rem;
      color: #a6adc8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      font-weight: 600;
    }

    #editor {
      width: 100%;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    button {
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      border-radius: 6px;
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) { background: #b4befe; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .hint {
      font-size: 0.78rem;
      color: #585b70;
    }

    #results { margin-top: 36px; }

    .results-label {
      font-size: 0.78rem;
      color: #a6adc8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .fn-card {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 14px;
    }

    .fn-name {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.95rem;
      color: #89b4fa;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .badges {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .badge-complexity {
      border-radius: 6px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .badge-time {
      background: #1e3a2f;
      border: 1px solid #a6e3a1;
      color: #a6e3a1;
    }

    .badge-space {
      background: #1a2a3a;
      border: 1px solid #89dceb;
      color: #89dceb;
    }

    .badge-label {
      font-size: 0.62rem;
      font-weight: 600;
      opacity: 0.65;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .explanation {
      font-size: 0.85rem;
      color: #bac2de;
      line-height: 1.7;
      border-top: 1px solid #313244;
      padding-top: 12px;
    }

    .banner {
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .banner-error {
      background: #2d1b1e;
      border: 1px solid #f38ba8;
      color: #f38ba8;
    }

    .banner-info {
      background: #1e2a1e;
      border: 1px solid #a6e3a1;
      color: #a6e3a1;
    }

    footer {
      border-top: 1px solid #313244;
      padding: 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .footer-credit {
      font-size: 0.8rem;
      color: #585b70;
      text-align: center;
      line-height: 1.6;
    }

    .footer-credit span { color: #a6adc8; font-weight: 600; }

    .linkedin-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #89b4fa;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      transition: color 0.15s;
    }

    .linkedin-link:hover { color: #b4befe; }
  </style>
</head>
<body>

<header>
  <h1>BigO Checker</h1>
  <span class="badge-mvp">Python · MVP</span>
  <div class="header-right">
    <a class="github-link" href="https://github.com/Nel-Medeiros/BigOChecker" target="_blank" rel="noopener noreferrer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
      </svg>
      GitHub/BigOChecker
    </a>
  </div>
</header>

<main>
  <label class="field-label">Paste your Python algorithm</label>
  <div id="editor"></div>

  <div class="actions">
    <button id="analyze-btn" disabled>Analyze →</button>
    <span class="hint">Python only · top-level def functions · async def not supported · Ctrl+Enter to analyze</span>
  </div>

  <div id="results"></div>
</main>

<script type="module">
  import { EditorState } from 'https://esm.sh/@codemirror/state@6'
  import { EditorView, keymap, lineNumbers, highlightActiveLine,
           highlightActiveLineGutter,
           placeholder } from 'https://esm.sh/@codemirror/view@6'
  import { defaultKeymap, indentWithTab } from 'https://esm.sh/@codemirror/commands@6'
  import { python } from 'https://esm.sh/@codemirror/lang-python@6'
  import { indentOnInput, indentUnit, bracketMatching, HighlightStyle,
           syntaxHighlighting } from 'https://esm.sh/@codemirror/language@6'
  import { tags } from 'https://esm.sh/@lezer/highlight@1'

  const catppuccinTheme = EditorView.theme({
    '&': {
      background: '#181825',
      color: '#cdd6f4',
      height: '220px',
      fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', monospace",
      fontSize: '0.88rem',
      borderRadius: '8px',
      border: '1px solid #313244',
    },
    '&.cm-focused': { border: '1px solid #89b4fa', outline: 'none' },
    '.cm-content': { padding: '16px', lineHeight: '1.6', caretColor: '#89b4fa' },
    '.cm-scroller': { overflow: 'auto', borderRadius: '8px' },
    '.cm-gutters': {
      background: '#1e1e2e',
      borderRight: '1px solid #313244',
      color: '#585b70',
      padding: '0 4px',
    },
    '.cm-activeLineGutter': { background: '#1e1e2e', color: '#a6adc8' },
    '.cm-activeLine': { background: 'rgba(49, 50, 68, 0.3)' },
    '.cm-selectionBackground': { background: '#313244 !important' },
    '&.cm-focused .cm-selectionBackground': { background: '#313244 !important' },
    '.cm-cursor': { borderLeftColor: '#89b4fa' },
    '.cm-placeholder': { color: '#585b70' },
  }, { dark: true })

  const catppuccinHighlight = HighlightStyle.define([
    { tag: tags.keyword,         color: '#cba6f7' },
    { tag: tags.definitionKeyword, color: '#cba6f7' },
    { tag: tags.controlKeyword,  color: '#cba6f7' },
    { tag: tags.moduleKeyword,   color: '#cba6f7' },
    { tag: [tags.function(tags.variableName), tags.function(tags.propertyName)], color: '#89b4fa' },
    { tag: tags.definition(tags.variableName), color: '#89b4fa' },
    { tag: tags.number,          color: '#fab387' },
    { tag: tags.string,          color: '#a6e3a1' },
    { tag: tags.comment,         color: '#585b70', fontStyle: 'italic' },
    { tag: tags.operator,        color: '#89dceb' },
    { tag: tags.punctuation,     color: '#cdd6f4' },
    { tag: tags.variableName,    color: '#cdd6f4' },
    { tag: [tags.bool, tags.null], color: '#fab387' },
  ])

  const btn = document.getElementById('analyze-btn')
  const results = document.getElementById('results')

  const editor = new EditorView({
    state: EditorState.create({
      doc: '',
      extensions: [
        lineNumbers(),
        highlightActiveLine(),
        highlightActiveLineGutter(),
        bracketMatching(),
        indentUnit.of('    '),
        indentOnInput(),
        keymap.of([
          ...defaultKeymap,
          indentWithTab,
          { key: 'Ctrl-Enter', run: () => { if (!btn.disabled) btn.click(); return true } },
        ]),
        python(),
        syntaxHighlighting(catppuccinHighlight),
        placeholder('def bubble_sort(arr):\n    for i in range(len(arr)):\n        for j in range(len(arr) - i - 1):\n            if arr[j] > arr[j + 1]:\n                arr[j], arr[j + 1] = arr[j + 1], arr[j]'),
        catppuccinTheme,
        EditorView.updateListener.of(update => {
          if (update.docChanged) {
            btn.disabled = editor.state.doc.toString().trim() === ''
          }
        }),
      ],
    }),
    parent: document.getElementById('editor'),
  })

  btn.addEventListener('click', async () => {
    btn.disabled = true
    btn.textContent = 'Analyzing...'
    results.innerHTML = ''

    try {
      const resp = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source: editor.state.doc.toString() }),
      })

      const data = await resp.json()

      if (!resp.ok) {
        if (resp.status === 400) {
          showBanner('error', `Syntax error on line ${data.detail.line}: ${data.detail.message}`)
        } else {
          showBanner('error', 'An unexpected error occurred. Please try again.')
        }
        return
      }

      if (data.length === 0) {
        showBanner('info', 'No function definitions found. Make sure your code contains at least one def (async def is not supported in this version).')
        return
      }

      const label = document.createElement('div')
      label.className = 'results-label'
      label.textContent = `Results — ${data.length} function${data.length !== 1 ? 's' : ''} found`
      results.appendChild(label)

      data.forEach(fn => results.appendChild(buildCard(fn)))

    } catch {
      showBanner('error', 'Could not reach the server. Is the backend running?')
    } finally {
      btn.disabled = editor.state.doc.toString().trim() === ''
      btn.textContent = 'Analyze →'
    }
  })

  function buildCard(fn) {
    const card = document.createElement('div')
    card.className = 'fn-card'

    const name = document.createElement('div')
    name.className = 'fn-name'
    name.textContent = `def ${fn.name}(...)`

    const badges = document.createElement('div')
    badges.className = 'badges'
    badges.appendChild(buildBadge('time', 'Time', fn.time_complexity))
    badges.appendChild(buildBadge('space', 'Space', fn.space_complexity))

    const explanation = document.createElement('div')
    explanation.className = 'explanation'
    explanation.textContent = fn.explanation

    card.appendChild(name)
    card.appendChild(badges)
    card.appendChild(explanation)
    return card
  }

  function buildBadge(type, label, value) {
    const badge = document.createElement('div')
    badge.className = `badge-complexity badge-${type}`

    const lbl = document.createElement('span')
    lbl.className = 'badge-label'
    lbl.textContent = label

    badge.appendChild(lbl)
    badge.appendChild(document.createTextNode(value))
    return badge
  }

  function showBanner(type, message) {
    const banner = document.createElement('div')
    banner.className = `banner banner-${type}`
    banner.textContent = message
    results.appendChild(banner)
  }
</script>


<footer>
  <p class="footer-credit">
    Imagined and Orchestrated by <span>Emanuel Medeiros</span> · Coded by <span>🤖 Claude Code</span>
  </p>

</footer>

</body>
</html>
