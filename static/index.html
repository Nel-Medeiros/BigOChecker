<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BigO Checker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 40px;
      border-bottom: 1px solid #313244;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 1.4rem; font-weight: 600; }

    .badge-mvp {
      background: #313244;
      color: #a6e3a1;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    main {
      flex: 1;
      padding: 32px 40px;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }

    .field-label {
      display: block;
      font-size: 0.78rem;
      color: #a6adc8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 220px;
      background: #181825;
      border: 1px solid #313244;
      border-radius: 8px;
      color: #cdd6f4;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.88rem;
      padding: 16px;
      resize: vertical;
      outline: none;
      line-height: 1.6;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: #89b4fa; }

    .actions {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    button {
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      border-radius: 6px;
      padding: 10px 28px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) { background: #b4befe; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .hint {
      font-size: 0.78rem;
      color: #585b70;
    }

    #results { margin-top: 36px; }

    .results-label {
      font-size: 0.78rem;
      color: #a6adc8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .fn-card {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 14px;
    }

    .fn-name {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.95rem;
      color: #89b4fa;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .badges {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .badge-complexity {
      border-radius: 6px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .badge-time {
      background: #1e3a2f;
      border: 1px solid #a6e3a1;
      color: #a6e3a1;
    }

    .badge-space {
      background: #1a2a3a;
      border: 1px solid #89dceb;
      color: #89dceb;
    }

    .badge-label {
      font-size: 0.62rem;
      font-weight: 600;
      opacity: 0.65;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .explanation {
      font-size: 0.85rem;
      color: #bac2de;
      line-height: 1.7;
      border-top: 1px solid #313244;
      padding-top: 12px;
    }

    .banner {
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .banner-error {
      background: #2d1b1e;
      border: 1px solid #f38ba8;
      color: #f38ba8;
    }

    .banner-info {
      background: #1e2a1e;
      border: 1px solid #a6e3a1;
      color: #a6e3a1;
    }
  </style>
</head>
<body>

<header>
  <h1>BigO Checker</h1>
  <span class="badge-mvp">Python · MVP</span>
</header>

<main>
  <label class="field-label" for="code">Paste your Python algorithm</label>
  <textarea id="code" spellcheck="false" placeholder="def bubble_sort(arr):&#10;    for i in range(len(arr)):&#10;        for j in range(len(arr) - i - 1):&#10;            if arr[j] > arr[j + 1]:&#10;                arr[j], arr[j + 1] = arr[j + 1], arr[j]"></textarea>

  <div class="actions">
    <button id="analyze-btn" disabled>Analyze →</button>
    <span class="hint">Python only · all top-level functions analyzed</span>
  </div>

  <div id="results"></div>
</main>

<script>
  const textarea = document.getElementById('code');
  const btn = document.getElementById('analyze-btn');
  const results = document.getElementById('results');

  textarea.addEventListener('input', () => {
    btn.disabled = !textarea.value.trim();
  });

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Analyzing...';
    results.innerHTML = '';

    try {
      const resp = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source: textarea.value }),
      });

      const data = await resp.json();

      if (!resp.ok) {
        if (resp.status === 400) {
          showBanner('error', `Syntax error on line ${data.detail.line}: ${data.detail.message}`);
        } else {
          showBanner('error', 'An unexpected error occurred. Please try again.');
        }
        return;
      }

      if (data.length === 0) {
        showBanner('info', 'No function definitions found. Make sure your code contains at least one def.');
        return;
      }

      const label = document.createElement('div');
      label.className = 'results-label';
      label.textContent = `Results — ${data.length} function${data.length !== 1 ? 's' : ''} found`;
      results.appendChild(label);

      data.forEach(fn => results.appendChild(buildCard(fn)));

    } catch {
      showBanner('error', 'Could not reach the server. Is the backend running?');
    } finally {
      btn.disabled = !textarea.value.trim();
      btn.textContent = 'Analyze →';
    }
  });

  function buildCard(fn) {
    const card = document.createElement('div');
    card.className = 'fn-card';

    const name = document.createElement('div');
    name.className = 'fn-name';
    name.textContent = `def ${fn.name}(...)`;

    const badges = document.createElement('div');
    badges.className = 'badges';
    badges.appendChild(buildBadge('time', 'Time', fn.time_complexity));
    badges.appendChild(buildBadge('space', 'Space', fn.space_complexity));

    const explanation = document.createElement('div');
    explanation.className = 'explanation';
    explanation.textContent = fn.explanation;

    card.appendChild(name);
    card.appendChild(badges);
    card.appendChild(explanation);
    return card;
  }

  function buildBadge(type, label, value) {
    const badge = document.createElement('div');
    badge.className = `badge-complexity badge-${type}`;

    const lbl = document.createElement('span');
    lbl.className = 'badge-label';
    lbl.textContent = label;

    badge.appendChild(lbl);
    badge.appendChild(document.createTextNode(value));
    return badge;
  }

  function showBanner(type, message) {
    const banner = document.createElement('div');
    banner.className = `banner banner-${type}`;
    banner.textContent = message;
    results.appendChild(banner);
  }
</script>

</body>
</html>
